name: Build & Release Workspace Manager

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable
        run: |
          pyinstaller --onefile --noconsole --name "Crypto90s_WorkspaceManager" Crypto90s_WorkspaceManager.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crypto90s_WorkspaceManager-Windows
          path: dist/Crypto90s_WorkspaceManager.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Crypto90s_WorkspaceManager.exe
          name: Workspace Manager ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
